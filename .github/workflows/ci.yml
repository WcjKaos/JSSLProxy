name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  gradle:
    name: Gradle test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Enable Gradle wrapper
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew --no-daemon test

      - name: Build artifacts
        run: ./gradlew --no-daemon build

  docker:
    name: Docker build and smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Gradle wrapper
        run: chmod +x ./gradlew

      - name: Validate test compose
        run: docker compose -f docker-compose.test.yml config

      - name: Build Docker image
        run: docker build -t jsslproxy:ci .

      - name: Run Docker smoke test
        run: docker compose -f docker-compose.test.yml run --rm test-runner bash ./scripts/smoke-test.sh

      - name: Cleanup compose services
        if: always()
        run: docker compose -f docker-compose.test.yml down --remove-orphans
