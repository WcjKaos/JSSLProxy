services:
  sslproxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: jsslproxy:latest
    container_name: jsslproxy
    restart: unless-stopped
    ports:
      # SSL 代理端口（需与 config/application.yml 中 server.port 保持一致）
      - "18443:18443"
      # 管理端口（默认只发布到宿主机 loopback）
      - "127.0.0.1:9090:9090"
    volumes:
      # 配置文件
      - ./config:/app/config:ro
      # 证书文件
      - ./certs:/app/certs:ro
      # 运行时数据，例如动态黑白名单持久化文件
      - ./data:/app/data
    environment:
      # JVM 内存配置
      JVM_MEMORY_OPTS: "-Xms256m -Xmx1g"
      # 密钥库密码（通过环境变量注入，不要硬编码）
      KEYSTORE_PASSWORD: "${KEYSTORE_PASSWORD:-}"
      TRUSTSTORE_PASSWORD: "${TRUSTSTORE_PASSWORD:-}"
      # 配置文件路径
      CONFIG_PATH: "/app/config/application.yml"
      # 管理端鉴权 Token。生产必须由宿主机环境变量注入。
      MANAGEMENT_TOKEN: "${MANAGEMENT_TOKEN:-}"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - proxy-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 256M

  # 示例后端服务（用于测试）
  backend:
    image: nginx:alpine
    container_name: backend-server
    networks:
      - proxy-network
    # 内部服务，不暴露端口
    expose:
      - "80"
      - "443"

  # Prometheus 监控（可选）
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    profiles:
      - monitoring
    ports:
      - "9091:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - proxy-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  # Grafana 仪表板（可选）
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    profiles:
      - monitoring
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - proxy-network
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false

networks:
  proxy-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
